name: Loan Approval CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train workshop model
        run: |
          python -m src.train

      - name: Run tests
        run: |
          pytest -v

      - name: Run model quality gate
        run: |
          python scripts/quality_gate.py

      - name: Build Docker image
        run: |
          docker build             -t loan-approval-api:${{ github.sha }}             .
