name: Deploy to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read
  id-token: write

env:
  REGION: us-central1
  SERVICE: loan-approval-api
  REPOSITORY: mlops-images

  # GitHub repository variables
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: mlops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate GCP configuration
        run: |
          if [[ -z "$PROJECT_ID" ]]; then
            echo "::error::Missing GCP_PROJECT_ID"
            exit 1
          fi

          if [[ -z "$WIF_PROVIDER" ]]; then
            echo "::error::Missing GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          fi

          if [[ -z "$GCP_SERVICE_ACCOUNT" ]]; then
            echo "::error::Missing GCP_SERVICE_ACCOUNT"
            exit 1
          fi

          echo "GCP configuration validated"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train workshop model
        run: |
          python -m src.train

      - name: Run tests
        run: |
          python -m pytest -v

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"

          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}

      - name: Health check
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Service URL: ${SERVICE_URL}"

          curl --fail \
            --retry 5 \
            --retry-delay 5 \
            "${SERVICE_URL}/health"