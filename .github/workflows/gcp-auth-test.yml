name: Test GCP Authentication

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test-gcp-auth:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: project-8b6d8385-5837-4698-ac6
          workload_identity_provider: projects/756673274459/locations/global/workloadIdentityPools/mls-pools/providers/github-provider
          service_account: github-runner@project-8b6d8385-5837-4698-ac6.iam.gserviceaccount.com

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Check authentication
        run: |
          gcloud auth list
          gcloud config get-value project
          gcloud projects describe project-8b6d8385-5837-4698-ac6